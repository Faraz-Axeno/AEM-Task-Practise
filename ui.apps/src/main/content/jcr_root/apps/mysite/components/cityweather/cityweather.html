<sly data-sly-use.clientlib="core/wcm/components/commons/v1/templates/clientlib.html">
    <sly data-sly-call="${clientlib.all @ categories='mysite.cityweather'}"/>
</sly>

<div data-sly-test="${wcmmode.edit && !properties.city}"
     class="cq-placeholder" 
     data-emptytext="City Weather Component - Click to configure City"></div>

<div class="cmp-cityweather" 
     data-city="${properties.city || 'London'}" 
     data-sly-test="${properties.city || !wcmmode.edit}">
    
    <div class="cmp-cityweather__card">
        <div class="cmp-cityweather__header">
            <h3 class="cmp-cityweather__city">${properties.city || 'London'}</h3>
            <span class="cmp-cityweather__status">Loading...</span>
        </div>
        <div class="cmp-cityweather__body" style="display:none;">
            <div class="cmp-cityweather__main">
                <span class="cmp-cityweather__temp">--</span>°C
                <span class="cmp-cityweather__desc"></span>
            </div>
            <div class="cmp-cityweather__details">
                <span>Humidity: <b class="cmp-cityweather__humidity">--</b>%</span>
                <span>Wind: <b class="cmp-cityweather__wind">--</b> km/h</span>
                <span>Feels Like: <b class="cmp-cityweather__feels">--</b>°C</span>
            </div>
        </div>
    </div>

</div>
